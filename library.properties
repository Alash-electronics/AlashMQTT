sentence=Easy MQTT client for ESP32, ESP8266 and Ethernet: publish, subscribe, auto-reconnect with re-subscribe, last will, clear errors. No PubSubClient needed.
paragraph=Publishes and subscribes to MQTT topics for smart-home and IoT projects with mqtt.publish(), mqtt.subscribe() and mqtt.update() in loop(): reconnects with growing delays, restores subscriptions after a drop, supports login, last will, retained messages and numbers as text, and explains refusals (wrong password, bad client id, blocked port) in Russian, Kazakh or English. Works over any Arduino Client (WiFiClient, WiFiClientSecure, EthernetClient). Examples included, made for classes and kits by Alash Electronics.
